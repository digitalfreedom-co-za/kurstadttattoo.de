name: Commit Message Policy

# Same check as org-ci-config/.github/workflows/commit-message-policy.yaml (wiki ci-cd.md).
# It is inlined because this repository is public and org-ci-config is private:
# GitHub only lets private repositories call reusable workflows from a private repository.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-commit-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Enforce commit message policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORBIDDEN_TOKENS: 'Claude,claude\.ai,Anthropic,Copilot,ChatGPT,OpenAI \(GPT,GPT-4,GPT-5,AI[ -]?generated,LLM[ -]?generated,machine[ -]?generated,🤖 Generated with,Co-Authored-By:.*Claude,Co-Authored-By:.*Copilot,Co-Authored-By:.*GPT,Co-Authored-By:.*OpenAI,Co-Authored-By:.*Anthropic'
        run: |
          set -e
          IFS=',' read -ra TOKENS <<< "$FORBIDDEN_TOKENS"
          fail=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            msg=$(git log -1 --format='%B' "$sha")
            for t in "${TOKENS[@]}"; do
              t_trimmed="$(echo "$t" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "$t_trimmed" ] && continue
              if printf '%s' "$msg" | grep -Eqi -- "$t_trimmed"; then
                echo "::error ::Commit $sha contains forbidden token matching: $t_trimmed"
                echo "--- offending commit message ---"
                printf '%s\n' "$msg" | sed 's/^/  /'
                echo "--------------------------------"
                fail=1
              fi
            done
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Commit message policy failed. Re-author or re-word the offending commits and force-push."
            exit 1
          fi
          echo "All commits clean."
